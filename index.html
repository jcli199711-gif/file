<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="定期定額">
<meta name="theme-color" content="#1b2a4a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>定期定額</title>
<style>
:root{--bg:#eef1f5;--ink:#1b2a4a;--sub:#5b6781;--card:#fff;--line:#d9dfe9;--navy:#1b2a4a;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1626;--ink:#e8edf7;--sub:#9aa7c2;--card:#18213a;--line:#2a3555;--navy:#7f9cff;--on:#0f1626}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.page{display:none;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 96px)}
.page.on{display:block}
h1{font-size:22px;margin:0 0 4px}
.lead{margin:0 0 20px;color:var(--sub);font-size:14px}
.result{background:var(--navy);color:var(--on);border-radius:20px;padding:22px 20px}
.result small{opacity:.8;font-size:13px}
.big{font-size:36px;font-weight:700;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;font-size:14px;padding-top:8px;margin-top:8px;border-top:1px solid color-mix(in srgb,var(--on) 25%,transparent)}
.row b{font-variant-numeric:tabular-nums}
svg.chart{display:block;width:100%;height:auto;margin:16px 0 4px}
.field{margin-top:18px}
.field label{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin-bottom:6px}
.field label b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--navy);height:32px}
.note{margin-top:22px;font-size:12px;color:var(--sub);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;font-size:15px;line-height:1.7}
.btn{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:var(--navy);color:var(--on);font-size:16px;font-weight:600;font-family:inherit}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:10px 0 8px;color:var(--sub);text-decoration:none;font-size:12px}
nav a svg{display:block;margin:0 auto 2px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--navy);font-weight:600}
</style>
</head>
<body>

<section class="page" id="p-calc">
  <h1>試算</h1>
  <p class="lead">每月固定投入，看看長期累積會變多少。</p>
  <div class="result" aria-live="polite">
    <small>預估期末資產</small>
    <div class="big" id="fv">–</div>
    <svg class="chart" id="chart" viewBox="0 0 320 120" role="img" aria-label="資產成長圖"></svg>
    <div class="row"><span>累積投入本金</span><b id="pr">–</b></div>
    <div class="row"><span>預估獲利</span><b id="gain">–</b></div>
  </div>
  <div class="field"><label for="m">每月投入<b id="mv"></b></label><input id="m" type="range" min="1000" max="100000" step="1000" value="10000"></div>
  <div class="field"><label for="r">年化報酬率<b id="rv"></b></label><input id="r" type="range" min="0" max="15" step="0.5" value="6"></div>
  <div class="field"><label for="y">投資年數<b id="yv"></b></label><input id="y" type="range" min="1" max="40" step="1" value="20"></div>
  <button class="btn" id="toGoal">用這組條件算目標</button>
</section>

<section class="page" id="p-goal">
  <h1>目標</h1>
  <p class="lead">先定目標金額，反推每月要投入多少。</p>
  <div class="result" aria-live="polite">
    <small>每月需投入</small>
    <div class="big" id="need">–</div>
    <div class="row"><span>累積投入本金</span><b id="gpr">–</b></div>
    <div class="row"><span>預估獲利</span><b id="ggain">–</b></div>
  </div>
  <div class="field"><label for="t">目標金額<b id="tv"></b></label><input id="t" type="range" min="500000" max="30000000" step="500000" value="5000000"></div>
  <div class="field"><label for="gr">年化報酬率<b id="grv"></b></label><input id="gr" type="range" min="0" max="15" step="0.5" value="6"></div>
  <div class="field"><label for="gy">投資年數<b id="gyv"></b></label><input id="gy" type="range" min="1" max="40" step="1" value="20"></div>
</section>

<section class="page" id="p-about">
  <h1>說明</h1>
  <p class="lead">這個小工具怎麼算。</p>
  <div class="card">每月月初投入固定金額，報酬以月複利計算。</div>
  <div class="card">報酬率是假設值，不代表實際績效。投資有風險，請依自身狀況評估。</div>
  <div class="card">從主畫面圖示開啟時，會以全螢幕顯示，不出現網址列。</div>
  <button class="btn" id="toCalc">回到試算</button>
</section>

<nav id="tabs">
  <a href="#/calc" data-p="calc"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>試算</a>
  <a href="#/goal" data-p="goal"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>目標</a>
  <a href="#/about" data-p="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8v.01"/></svg>說明</a>
</nav>

<script>
const $=id=>document.getElementById(id);
const nt=n=>"NT$ "+Math.round(n).toLocaleString("zh-TW");
const fv=(P,a,n)=>{const r=a/100/12;return r===0?P*n:P*((Math.pow(1+r,n)-1)/r)*(1+r)};

/* 頁面切換：用網址片段 #/calc、#/goal、#/about */
function route(){
  const p=(location.hash.match(/^#\/(\w+)/)||[])[1];
  const name=["calc","goal","about"].includes(p)?p:"calc";
  document.querySelectorAll(".page").forEach(e=>e.classList.toggle("on",e.id==="p-"+name));
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.p===name));
  scrollTo(0,0);
}
addEventListener("hashchange",route);

/* 試算頁 */
function calc(){
  const P=+$("m").value,a=+$("r").value,y=+$("y").value;
  $("mv").textContent=nt(P);$("rv").textContent=a+"%";$("yv").textContent=y+" 年";
  const end=fv(P,a,y*12),pr=P*y*12,W=320,H=120,pad=6,max=end||1;
  const pts=k=>Array.from({length:y+1},(_,i)=>{const v=k==="v"?fv(P,a,i*12):P*i*12;return [pad+(W-2*pad)*i/y,H-pad-(H-2*pad)*v/max]});
  const line=p=>p.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  const v=pts("v"),b=pts("p");
  $("fv").textContent=nt(end);$("pr").textContent=nt(pr);$("gain").textContent=nt(end-pr);
  $("chart").innerHTML=
   `<polygon points="${line(v)} ${W-pad},${H-pad} ${pad},${H-pad}" fill="currentColor" opacity=".18"/>`+
   `<polyline points="${line(v)}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>`+
   `<polyline points="${line(b)}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>`;
}
/* 目標頁 */
function goal(){
  const T=+$("t").value,a=+$("gr").value,y=+$("gy").value;
  $("tv").textContent=nt(T);$("grv").textContent=a+"%";$("gyv").textContent=y+" 年";
  const P=T/fv(1,a,y*12),pr=P*y*12;
  $("need").textContent=nt(P);$("gpr").textContent=nt(pr);$("ggain").textContent=nt(T-pr);
}
["m","r","y"].forEach(i=>$(i).addEventListener("input",calc));
["t","gr","gy"].forEach(i=>$(i).addEventListener("input",goal));

/* 按鈕跳轉：把試算頁的報酬率、年數帶到目標頁 */
$("toGoal").onclick=()=>{$("gr").value=$("r").value;$("gy").value=$("y").value;goal();location.hash="#/goal"};
$("toCalc").onclick=()=>{location.hash="#/calc"};
calc();goal();route();
</script>
</body>
</html>
